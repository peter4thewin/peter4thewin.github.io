<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Photos of Suzie, Peter Liu's cat.">
  <title>Suzie — Peter Liu</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    html, body { overflow-x: clip; }
    main { padding-top: clamp(110px, 15vh, 150px); padding-bottom: 60px; }
    .cats { --cw: clamp(170px, min(26vw, 44svh), 360px); }
    .cats .page-title { margin-bottom: 0; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

    /* Carousel: the front photo is full size, the ones beside it step down and tuck behind it.
       Position, scale, brightness, stacking order and the soft edge where photos overlap are all
       set continuously by render() in the script. */
    .stage { position:relative; height:calc(var(--cw) * 4 / 3); margin-top:36px; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
    .cat-card {
      position:absolute; top:0; left:50%; width:var(--cw); aspect-ratio:3/4; margin:0;
      border-radius:6px; overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      transform:translateX(-50%);
      transition:none;
    }
    /* The placeholder color lives on the image (not the card) so a feathered edge blends into the photo underneath. */
    .cat-card img { display:block; width:100%; height:100%; object-fit:cover; background:#151d35; pointer-events:none; -webkit-user-drag:none; }
    .cat-card[data-pos="left"], .cat-card[data-pos="right"] { cursor:pointer; }

    .controls { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:34px; }
    .controls .btn { width:44px; height:44px; padding:0; display:grid; place-items:center; font-size:16px; letter-spacing:0; }
    .count { min-width:64px; text-align:center; color:var(--subtle); font-size:12px; letter-spacing:.13em; }
    .toggle { margin-left:12px; padding:8px 0; border:0; background:transparent; color:var(--muted); font:inherit; font-size:12px; letter-spacing:.13em; text-transform:uppercase; cursor:pointer; transition:color 180ms ease; }
    .toggle:hover { color:var(--white); }

    @media (max-width:700px) {
      .cats { --cw: min(58vw, 40svh); }
      main { padding-top: 150px; }
      .controls { gap:16px; }
      .toggle { margin-left:4px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Peter Liu</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="about.html">About</a>
      <a href="works.html">Selected Works</a>
      <a href="suzie.html" class="active" aria-current="page">Suzie</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main class="cats" style="--w:1280px">
    <h1 class="page-title">Suzie</h1>
    <section aria-roledescription="carousel" aria-label="Photos of Suzie">
      <div class="stage" id="stage">
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="1 of 7"><img src="assets/cats/cat-1.jpg" alt="Suzie, a black cat, in close-up with bright green eyes reaching toward the camera" width="900" height="1200" draggable="false" decoding="async"></figure>
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="2 of 7"><img src="assets/cats/cat-2.jpg" alt="Suzie standing on an orange rug and looking at the camera" width="900" height="1200" draggable="false" decoding="async"></figure>
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="3 of 7"><img src="assets/cats/cat-3.jpg" alt="Suzie sitting on an orange armchair beside a window" width="900" height="1200" draggable="false" decoding="async"></figure>
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="4 of 7"><img src="assets/cats/cat-4.jpg" alt="Suzie in a green holiday sweater sitting on a couch" width="900" height="1200" draggable="false" decoding="async"></figure>
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="5 of 7"><img src="assets/cats/cat-5.jpg" alt="Suzie lounging on top of a white printer" width="900" height="1200" draggable="false" decoding="async"></figure>
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="6 of 7"><img src="assets/cats/cat-6.jpg" alt="Suzie, a black cat, in close-up looking up from the floor" width="900" height="1200" draggable="false" decoding="async"></figure>
      <figure class="cat-card" role="group" aria-roledescription="slide" aria-label="7 of 7"><img src="assets/cats/cat-7.jpg" alt="Peter lying on a couch with Suzie resting on his chest" width="900" height="1200" draggable="false" decoding="async"></figure>
      </div>
      <div class="controls">
        <button class="btn" type="button" id="prev" aria-label="Previous photo">&larr;</button>
        <span class="count" id="count" aria-hidden="true"></span>
        <button class="btn" type="button" id="next" aria-label="Next photo">&rarr;</button>
        <button class="toggle" type="button" id="toggle">Pause</button>
      </div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const cards = [...stage.querySelectorAll('.cat-card')];
    const count = document.getElementById('count');
    const live = document.getElementById('live');
    const toggle = document.getElementById('toggle');
    const n = cards.length;
    const half = Math.floor(n / 2);
    const MS_PER_PHOTO = 9500; // One photo moves smoothly through the center every 9.5 seconds.
    // Where two neighboring photos trade places in the stack, the photo on top gets a soft edge that
    // covers only the strip where the two overlap, so the hand-off blends instead of popping.
    // This is how close to that hand-off (in photo steps) the soft edge appears; larger = it shows for longer.
    const FEATHER_RANGE = 0.6;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let phase = 0;
    let playing = !reduceMotion;
    let hovering = false;
    let lastFrame = null;
    let raf = null;
    let announced = -1;
    let cardW = cards[0].offsetWidth;

    // Map a card's fractional distance from center to its visual depth.
    // The center card is largest; each step away gets smaller and dimmer.
    function visualAt(distance) {
      const d = Math.abs(distance);
      const points = [
        { d: 0, x: 0, scale: 1, brightness: 1, opacity: 1 },
        { d: 1, x: .8, scale: .8, brightness: .55, opacity: 1 },
        { d: 2, x: 1.4, scale: .62, brightness: .38, opacity: 1 },
        { d: 3, x: 1.4, scale: .5, brightness: .38, opacity: 0 }
      ];
      const a = points[Math.min(2, Math.floor(d))];
      const b = points[Math.min(3, Math.floor(d) + 1)];
      const t = Math.min(1, d - a.d);
      return {
        x: (a.x + (b.x - a.x) * t) * Math.sign(distance),
        scale: a.scale + (b.scale - a.scale) * t,
        brightness: a.brightness + (b.brightness - a.brightness) * t,
        opacity: a.opacity + (b.opacity - a.opacity) * t
      };
    }

    // Build a horizontal alpha mask that fades the left and/or right edge of a photo.
    // fl / fr are the fade widths as a fraction of the photo's own width.
    function edgeMask(fl, fr) {
      if (fl <= 0 && fr <= 0) return 'none';
      const stops = [
        fl > 0 ? `transparent 0%, #000 ${(fl * 100).toFixed(2)}%` : '#000 0%',
        fr > 0 ? `#000 ${((1 - fr) * 100).toFixed(2)}%, transparent 100%` : '#000 100%'
      ];
      return `linear-gradient(to right, ${stops.join(', ')})`;
    }

    function render() {
      const front = Math.round(phase) % n;

      // 1. Where is every card right now?
      const s = cards.map((card, i) => {
        let offset = i - phase;
        while (offset > half) offset -= n;
        while (offset < -half) offset += n;
        const v = visualAt(offset);
        const w = cardW * v.scale;
        const cx = cardW * v.x;
        return { card, offset, v, cx, w, left: cx - w / 2, right: cx + w / 2, fl: 0, fr: 0 };
      });

      // 2. For every pair of overlapping cards, soften the edge of whichever one is on top.
      // The strength peaks when the two are equally far from center (that's when the stacking order swaps).
      // The fade spans exactly the overlap strip, so just before the swap "B fades into A" and just after it
      // "A fades in over B": the strip looks identical on both sides of the swap.
      for (let a = 0; a < n; a++) {
        for (let b = a + 1; b < n; b++) {
          const p = s[a], q = s[b];
          const l = p.cx < q.cx ? p : q;
          const r = l === p ? q : p;
          const overlap = l.right - r.left;
          if (overlap <= 0) continue;

          const dist = Math.abs(Math.abs(p.offset) - Math.abs(q.offset));
          const x = Math.max(0, Math.min(1, 1 - dist / FEATHER_RANGE));
          const strength = x * x * (3 - 2 * x);
          if (strength <= 0) continue;

          const top = Math.abs(p.offset) < Math.abs(q.offset) ? p : q;
          const fade = Math.min(.5, (overlap * strength) / top.w);
          if (top === l) top.fr = Math.max(top.fr, fade); // on top of the card to its right
          else top.fl = Math.max(top.fl, fade);           // on top of the card to its left
        }
      }

      // 3. Apply.
      s.forEach(({ card, offset, v, fl, fr }) => {
        card.style.transform = `translateX(calc(-50% + var(--cw) * ${v.x})) scale(${v.scale})`;
        card.style.filter = `brightness(${v.brightness})`;
        card.style.opacity = v.opacity;
        // Stack strictly by distance from center: the closest card is always on top.
        // (Equal z-index values would fall back to DOM order, which made the overlap look wrong.)
        card.style.zIndex = String(Math.round((10 - Math.abs(offset)) * 100));
        card.style.pointerEvents = Math.abs(offset) <= 2.5 ? 'auto' : 'none';
        card.dataset.pos = Math.abs(offset) < .5 ? '0' : (offset > 0 ? 'right' : 'left');
        card.setAttribute('aria-hidden', Math.abs(offset) > 2.5 ? 'true' : 'false');

        const mask = edgeMask(fl, fr);
        const img = card.firstElementChild;
        img.style.webkitMaskImage = mask;
        img.style.maskImage = mask;
      });

      if (front !== announced) {
        announced = front;
        count.textContent = (front + 1) + ' / ' + n;
        live.textContent = 'Photo ' + (front + 1) + ' of ' + n;
      }
    }

    function setPlaying(on) {
      playing = on;
      toggle.textContent = on ? 'Pause' : 'Play';
      lastFrame = null;
      if (playing && raf === null) raf = requestAnimationFrame(tick);
    }

    function manual(i) {
      setPlaying(false);
      phase = (i + n) % n;
      render();
    }

    function tick(timestamp) {
      raf = null;
      if (lastFrame !== null && playing && !hovering && !document.hidden) {
        phase = (phase + (timestamp - lastFrame) / MS_PER_PHOTO) % n;
        render();
      }
      lastFrame = timestamp;
      if (playing) raf = requestAnimationFrame(tick);
    }

    document.getElementById('prev').addEventListener('click', () => manual(Math.round(phase) - 1));
    document.getElementById('next').addEventListener('click', () => manual(Math.round(phase) + 1));
    toggle.addEventListener('click', () => setPlaying(!playing));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') manual(Math.round(phase) - 1);
      if (e.key === 'ArrowRight') manual(Math.round(phase) + 1);
    });

    // Swipe or drag to rotate; click a side photo to bring it to the front.
    let startX = null, dragged = false;
    stage.addEventListener('pointerdown', e => { startX = e.clientX; dragged = false; });
    stage.addEventListener('pointerup', e => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      startX = null;
      if (Math.abs(dx) > 40) {
        dragged = true;
        manual(Math.round(phase) + (dx < 0 ? 1 : -1));
      }
    });
    stage.addEventListener('pointercancel', () => { startX = null; });
    cards.forEach((card, i) => card.addEventListener('click', () => {
      if (dragged) { dragged = false; return; }
      if (Math.abs(i - phase) > .5) manual(i);
    }));

    stage.addEventListener('mouseenter', () => { hovering = true; });
    stage.addEventListener('mouseleave', () => { hovering = false; lastFrame = null; });
    document.addEventListener('visibilitychange', () => { lastFrame = null; });

    // Card size depends on the viewport, so re-measure it when it changes.
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => { cardW = cards[0].offsetWidth; render(); }).observe(cards[0]);
    }

    render();
    setPlaying(playing);
  </script>
</body>
</html>
