    .brand { position:fixed; top:30px; left:34px; color:var(--white); text-decoration:none; font:600 16px Montserrat,"Helvetica Neue",sans-serif; letter-spacing:-.01em; }
    nav { position:fixed; top:30px; right:34px; display:flex; gap:clamp(16px,2.5vw,32px); }
    nav a { color:var(--muted); text-decoration:none; font-size:12px; letter-spacing:.13em; text-transform:uppercase; transition:color 180ms ease; }
    nav a:hover, nav a.active { color:var(--white); }
    main { min-height:100svh; width:min(100% - 48px,760px); margin:0 auto; padding:clamp(145px,20vh,205px) 0 80px; }
    h1 { margin:0; font:600 clamp(2.2rem,5vw,3.4rem)/1.05 Montserrat,"Helvetica Neue",sans-serif; letter-spacing:-.025em; }
    .intro { margin:18px 0 48px; color:var(--muted); font-size:12px; letter-spacing:.13em; text-transform:uppercase; }
    form { display:grid; gap:27px; }
    .field { display:grid; gap:11px; }
    label { color:var(--muted); font-size:12px; letter-spacing:.13em; text-transform:uppercase; }
    input, textarea { width:100%; border:0; border-bottom:1px solid rgba(245,247,255,.28); border-radius:0; padding:12px 0 14px; background:transparent; color:var(--white); font:16px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif; outline:none; transition:border-color 180ms ease; }
    input::placeholder, textarea::placeholder { color:rgba(245,247,255,.38); }
    input:focus, textarea:focus { border-color:var(--white); }
    textarea { min-height:145px; resize:vertical; }
    .send { justify-self:start; margin-top:8px; padding:13px 22px; border:1px solid rgba(245,247,255,.55); background:transparent; color:var(--white); font:inherit; font-size:12px; letter-spacing:.13em; text-transform:uppercase; cursor:pointer; transition:background 180ms ease,color 180ms ease; }
    .send:hover { background:var(--white); color:var(--bg); }
    .form-note { color:var(--muted); font-size:12px; line-height:1.6; margin:0; }
    @media(max-width:640px) {
      .brand { top:18px; left:18px; font-size:14px; }
      nav { top:58px; left:18px; right:18px; justify-content:flex-end; gap:14px; }
      nav a { font-size:12px; letter-spacing:.06em; }
      main { width:calc(100% - 40px); padding-top:160px; }
      .intro { margin-bottom:38px; }
    }

  <a class="brand" href="index.html">Peter Liu</a>
  <nav aria-label="Main navigation">
    <a href="about.html">About</a>

    <a href="contact.html" class="active" aria-current="page">Contact</a>
  </nav>
  <main>
    <h1>Contact</h1>
    <p class="intro">For projects, collaborations, or just to say hello.</p>
    <form action="https://api.web3forms.com/submit" method="POST">
      <!-- Replace with your Web3Forms access key (safe to be public) -->
      <input type="hidden" name="access_key" value="214aa145-0047-4341-9ede-e3f7fd6fd376">
      <input type="hidden" name="subject" value="New message from peterxliu.com">
      <input type="hidden" name="from_name" value="peterxliu.com">
      <input type="hidden" name="redirect" value="https://peterxliu.com/thanks.html">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell me a little about what you have in mind..." required></textarea>
      </div>
      <button class="send" type="submit">Send message&nbsp; ↗</button>
      <p class="form-note">Your message will be sent directly to my inbox.</p>
    </form>
  </main>
