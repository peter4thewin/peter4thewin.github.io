<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c36"/>
      <stop offset=".48" stop-color="#09152b"/>
      <stop offset="1" stop-color="#101d38"/>
    </linearGradient>
    <radialGradient id="vignette">
      <stop offset=".25" stop-color="#263858" stop-opacity=".10"/>
      <stop offset="1" stop-color="#020916" stop-opacity=".72"/>
    </radialGradient>
    <filter id="stone" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="17" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncR type="gamma" amplitude=".23" exponent="1.45" offset="0"/>
        <feFuncG type="gamma" amplitude=".29" exponent="1.45" offset="0"/>
        <feFuncB type="gamma" amplitude=".42" exponent="1.45" offset="0"/>
        <feFuncA type="table" tableValues="0 .28"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
    <filter id="clouds">
      <feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="3" seed="8" result="cloud"/>
      <feColorMatrix in="cloud" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect width="2400" height="1350" fill="url(#base)"/>
  <rect width="2400" height="1350" fill="#243653" opacity=".22" filter="url(#clouds)"/>
  <g fill="none" stroke="#71809a" opacity=".13">
    <path d="M-180 900 C220 650 410 790 690 1010 S1120 1290 1450 1130" stroke-width="3"/>
    <path d="M-160 950 C220 700 420 850 700 1060 S1110 1330 1460 1180" stroke-width="1.4"/>
    <circle cx="1940" cy="310" r="340" stroke-width="3"/>
    <circle cx="1940" cy="310" r="385" stroke-width="1.5"/>
    <circle cx="1940" cy="310" r="430" stroke-width="1"/>
    <path d="M1640 0 A420 420 0 0 1 2360 660 M1740 0 A330 330 0 0 1 2290 560" stroke-width="2"/>
  </g>
  <rect width="2400" height="1350" fill="url(#vignette)"/>
  <rect width="2400" height="1350" fill="#152641" opacity=".26" filter="url(#stone)"/>
</svg>