<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e7e0">
  <meta name="description" content="Peter Liu — director, filmmaker, and artist.">
  <title>Peter Liu — Director · Filmmaker · Artist</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e9e7e0;
      --ink: #22231f;
      --muted: #77776f;
      --line: rgba(34,35,31,.18);
      --ease: cubic-bezier(.22,.7,.18,1);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      position: relative;
    }
    .landing {
      width: min(100%, 510px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 450ms ease;
    }
    .landing.is-leaving {
      opacity: 0;
      pointer-events: none;
    }
    .portrait-button {
      width: min(64vw, 340px);
      aspect-ratio: 4 / 5;
      padding: 0;
      border: 0;
      background: #c5c0b5;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: block;
      outline-offset: 8px;
      isolation: isolate;
    }
    .portrait-art {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: url("assets/black-cat.jpg") center 42% / cover no-repeat;
      filter: none;
      transition: transform 1.1s var(--ease), filter 1.1s var(--ease);
    }
    .portrait-art::before { content: none; }
    .portrait-art::after { content: none; }

    /* The flying copy of the portrait. Same image, same crop rule as the
       button, so it matches the original exactly at the start and lands
       exactly on the video frame at the end. Its box is animated from JS. */
    .portrait-morph {
      position: fixed;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
      background: url("assets/black-cat.jpg") center 42% / cover no-repeat;
      will-change: left, top, width, height, opacity;
    }
    .portrait-caption {
      position: absolute;
      left: 16px;
      bottom: 14px;
      color: rgba(255,255,255,.8);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      z-index: 2;
    }
    .name {
      margin: 27px 0 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(2.15rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: .015em;
      line-height: 1;
    }
    .role {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .reel {
      width: min(100%, 1120px);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 750ms ease, visibility 0s linear 750ms;
    }
    /* Laid out in its final position but invisible, so JS can measure it. */
    .reel.is-preparing {
      opacity: 0;
      visibility: visible;
      transition: none;
    }
    /* Switches on instantly, while the portrait is still covering it. */
    .reel.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: none;
    }
    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #171816;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,.12);
    }
    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #171816;
    }
    .reel-note {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 300ms ease;
    }
    .reel.is-visible .reel-note {
      opacity: 1;
      transition: opacity 1200ms ease 700ms;
    }
    .back {
      position: fixed;
      top: 28px;
      left: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 0;
      font: inherit;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 500ms ease;
    }
    .back.is-visible { opacity: 1; visibility: visible; }
    .back:hover { color: var(--ink); }
    .footer-note {
      position: fixed;
      bottom: 25px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .13em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .page { padding: 70px 20px; }
      .portrait-button { width: min(72vw, 310px); }
      .reel { width: calc(100% - 32px); }
      .back { top: 16px; left: 18px; }
      .footer-note { left: 18px; right: 18px; bottom: 16px; }
      .reel-note { font-size: 8px; letter-spacing: .1em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="landing" id="landing" aria-label="Peter Liu portfolio">
      <button class="portrait-button" id="enter" aria-label="Play Peter Liu's director reel">
        <span class="portrait-art" aria-hidden="true"></span>
        
      </button>
      <h1 class="name">Peter Liu</h1>
      <p class="role">Director · Filmmaker · Artist</p>
    </section>

    <section class="reel" id="reel" aria-label="Director's reel">
      <div class="video-frame">
        <div id="directorVideo" title="Peter Liu — Director's Reel"></div>
      </div>
      <div class="reel-note">
        <span>Peter Liu</span>
        <span>Director's reel</span>
      </div>
    </section>
    <button class="back" id="back" type="button">← Back</button>
  </main>
  <div class="footer-note" aria-hidden="true">
    <span>Los Angeles, California</span>
    <span>© <span id="year"></span> Peter Liu</span>
  </div>
  <script>
    const landing = document.getElementById('landing');
    const reel = document.getElementById('reel');
    const frame = reel.querySelector('.video-frame');
    const enter = document.getElementById('enter');
    const back = document.getElementById('back');
    document.getElementById('year').textContent = new Date().getFullYear();

    // Transition tuning
    const EXPAND_MS = 1000;                  // portrait grows into the video frame
    const FADE_MS = 1800;                    // portrait dissolves to reveal the video
    const EASE = 'cubic-bezier(.72, 0, .16, 1)';
    const FADE_EASE = 'cubic-bezier(.37, 0, .63, 1)';  // slow in, slow out, like a breath
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let player = null;
    let playerReady = false;
    let playWhenReady = false;
    let busy = false;
    let activeMorph = null;

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('directorVideo', {
        videoId: 'PqKCBEA_CDw',
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          enablejsapi: 1,
          // file:// pages report origin "null", which makes the player error out
          ...(location.protocol.startsWith('http') ? { origin: location.origin } : {})
        },
        events: {
          onReady: () => {
            playerReady = true;
            if (playWhenReady) player.playVideo();
          }
        }
      });
    };

    const youtubeApi = document.createElement('script');
    youtubeApi.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(youtubeApi);

    const px = n => n + 'px';
    const box = r => ({ left: px(r.left), top: px(r.top), width: px(r.width), height: px(r.height) });

    enter.addEventListener('click', async () => {
      if (busy || landing.classList.contains('is-leaving')) return;
      busy = true;

      const from = enter.getBoundingClientRect();

      // Lay the reel out in its final spot (still invisible) and measure the real
      // video frame, so the portrait lands on it to the pixel.
      reel.classList.add('is-preparing');
      const to = frame.getBoundingClientRect();

      const morph = document.createElement('div');
      morph.className = 'portrait-morph';
      morph.setAttribute('aria-hidden', 'true');
      Object.assign(morph.style, box(from));
      document.body.appendChild(morph);

      landing.inert = true;
      landing.classList.add('is-leaving');

      // Start playback inside the click so mobile browsers allow it.
      if (playerReady) player.playVideo();
      else playWhenReady = true;

      activeMorph = morph;

      try {
        // 1) Expand: portrait box grows into the video frame.
        const grow = morph.animate([box(from), box(to)], {
          duration: reduceMotion ? 1 : EXPAND_MS,
          easing: EASE,
          fill: 'forwards'
        });
        await grow.finished;

        // 2) Reveal: the portrait is now exactly covering the video frame.
        //    Switch the video on underneath it, then dissolve the portrait.
        reel.classList.add('is-visible');
        reel.classList.remove('is-preparing');
        back.classList.add('is-visible');
        busy = false; // Back may interrupt the dissolve from here on

        const fade = morph.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: reduceMotion ? 1 : FADE_MS,
          easing: FADE_EASE,
          fill: 'forwards'
        });
        await fade.finished;
      } catch (err) {
        // Back cancelled the animation mid-way; nothing to finish.
      } finally {
        morph.remove();
        if (activeMorph === morph) {
          activeMorph = null;
          busy = false;
        }
      }
    });

    back.addEventListener('click', () => {
      if (busy) return;
      if (activeMorph) {
        activeMorph.getAnimations().forEach(a => a.cancel());
        activeMorph.remove();
        activeMorph = null;
      }
      playWhenReady = false;
      if (playerReady) {
        player.pauseVideo();
        player.seekTo(0, true);
      }
      landing.inert = false;
      landing.classList.remove('is-leaving');
      reel.classList.remove('is-visible');
      back.classList.remove('is-visible');
    });
  </script>
</body>
</html>
