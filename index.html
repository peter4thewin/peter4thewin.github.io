<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e7e0">
  <meta name="description" content="Peter Liu — director, filmmaker, and artist.">
  <title>Peter Liu — Director · Filmmaker · Artist</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e9e7e0;
      --ink: #22231f;
      --muted: #77776f;
      --line: rgba(34,35,31,.18);
      --ease: cubic-bezier(.22,.7,.18,1);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      position: relative;
    }
    .landing {
      width: min(100%, 510px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 1000ms var(--ease), transform 1200ms var(--ease), filter 1000ms var(--ease);
    }
    .portrait-button {
      width: min(64vw, 340px);
      aspect-ratio: 4 / 5;
      padding: 0;
      border: 0;
      background: #c5c0b5;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: block;
      outline-offset: 8px;
      isolation: isolate;
    }
    .portrait-morph {
      position: fixed;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
      will-change: left, top, width, height;
      transition:
        left 1250ms cubic-bezier(.65,0,.35,1),
        top 1250ms cubic-bezier(.65,0,.35,1),
        width 1250ms cubic-bezier(.65,0,.35,1),
        height 1250ms cubic-bezier(.65,0,.35,1);
    }
    .portrait-morph .portrait-art {
      position: absolute;
      inset: auto;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 125%;
      transform: translate(-50%, -50%);
      transition: opacity 350ms ease;
      will-change: opacity;
    }
    .portrait-morph.is-revealing .portrait-art {
      opacity: 0;
    }
    .portrait-art {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: url("assets/black-cat.jpg") center 42% / cover no-repeat;
      filter: none;
      transition: transform 1.1s var(--ease), filter 1.1s var(--ease);
    }
    .portrait-art::before { content: none; }
    .portrait-art::after { content: none; }
    .portrait-caption {
      position: absolute;
      left: 16px;
      bottom: 14px;
      color: rgba(255,255,255,.8);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      z-index: 2;
    }
    .portrait-button:hover .portrait-art { transform: scale(1.035); filter: saturate(.75) contrast(1.06); }
    .name {
      margin: 27px 0 0;
      font-family: "Times New Roman", Georgia, serif;
      font-size: clamp(2.15rem, 5vw, 3rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: 1;
    }
    .role {
      margin: 11px 0 0;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .landing.is-leaving {
      opacity: 0;
      transform: scale(.985);
      filter: blur(3px);
      pointer-events: none;
    }
    .reel {
      width: min(100%, 1120px);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -47%) scale(.995);
      opacity: 0;
      visibility: hidden;
      transition: opacity 750ms ease, transform 0s, visibility 0s linear 750ms;
    }
    .reel.is-preparing {
      opacity: 0;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition: none;
    }
    .reel.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
      transition: opacity 350ms ease;
      transition-delay: 0s;
    }
    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #171816;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,.12);
    }
    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #171816;
    }
    .reel-note {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .back {
      position: fixed;
      top: 28px;
      left: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 0;
      font: inherit;
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: opacity 500ms ease;
    }
    .back.is-visible { opacity: 1; visibility: visible; }
    .back:hover { color: var(--ink); }
    .footer-note {
      position: fixed;
      bottom: 25px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .13em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .page { padding: 70px 20px; }
      .portrait-button { width: min(72vw, 310px); }
      .reel { width: calc(100% - 32px); }
      .back { top: 16px; left: 18px; }
      .footer-note { left: 18px; right: 18px; bottom: 16px; }
      .reel-note { font-size: 8px; letter-spacing: .1em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="landing" id="landing" aria-label="Peter Liu portfolio">
      <button class="portrait-button" id="enter" aria-label="Play Peter Liu's director reel">
        <span class="portrait-art" aria-hidden="true"></span>
        
      </button>
      <h1 class="name">Peter Liu</h1>
      <p class="role">Director · Filmmaker · Artist</p>
    </section>

    <section class="reel" id="reel" aria-label="Director's reel">
      <div class="video-frame">
        <div id="directorVideo" title="Peter Liu — Director's Reel"></div>
      </div>
      <div class="reel-note">
        <span>Peter Liu</span>
        <span>Director's reel</span>
      </div>
    </section>
    <button class="back" id="back" type="button">← Back</button>
  </main>
  <div class="footer-note" aria-hidden="true">
    <span>Los Angeles, California</span>
    <span>© <span id="year"></span> Peter Liu</span>
  </div>
  <script>
    const landing = document.getElementById('landing');
    const reel = document.getElementById('reel');
    const video = document.getElementById('directorVideo');
    const enter = document.getElementById('enter');
    let player = null;

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('directorVideo', {
        videoId: 'PqKCBEA_CDw',
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {}
        }
      });
    };

    const youtubeApi = document.createElement('script');
    youtubeApi.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(youtubeApi);
    const back = document.getElementById('back');
    document.getElementById('year').textContent = new Date().getFullYear();

    enter.addEventListener('click', () => {
      if (landing.classList.contains('is-leaving')) return;

      const start = enter.getBoundingClientRect();
      const portraitMorph = document.createElement('div');
      portraitMorph.className = 'portrait-morph';
      portraitMorph.setAttribute('aria-hidden', 'true');
      const portraitArt = enter.querySelector('.portrait-art').cloneNode(true);
      portraitMorph.appendChild(portraitArt);

      Object.assign(portraitMorph.style, {
        left: start.left + 'px',
        top: start.top + 'px',
        width: start.width + 'px',
        height: start.height + 'px'
      });
      document.body.appendChild(portraitMorph);

      landing.classList.add('is-leaving');
      reel.classList.add('is-preparing');
      back.classList.add('is-visible');

      const reelWidth = reel.clientWidth;
      const reelHeight = reelWidth * 9 / 16;
      const target = {
        left: (window.innerWidth - reelWidth) / 2,
        top: (window.innerHeight - reelHeight) / 2,
        width: reelWidth,
        height: reelHeight
      };

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          Object.assign(portraitMorph.style, {
            left: target.left + 'px',
            top: target.top + 'px',
            width: target.width + 'px',
            height: target.height + 'px'
          });
        });
      });

      if (player) {
        player.playVideo();
      }

      // Begin dissolving the portrait during the final part of its expansion.
      window.setTimeout(() => {
        portraitMorph.classList.add('is-revealing');
      }, 800);

      // Bring in the reel just before the expansion finishes, overlapping the dissolve.
      window.setTimeout(() => {
        reel.classList.add('is-visible');
      }, 1050);

      window.setTimeout(() => {
        portraitMorph.remove();
        landing.hidden = true;
        reel.classList.remove('is-preparing');
      }, 2050);
    });

    back.addEventListener('click', () => {
      if (player) {
        player.pauseVideo();
        player.seekTo(0, true);
      }
      landing.hidden = false;
      requestAnimationFrame(() => {
        landing.classList.remove('is-leaving');
        reel.classList.remove('is-visible');
        back.classList.remove('is-visible');
      });
    });
  </script>
</body>
</html>
