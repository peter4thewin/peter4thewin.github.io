<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Message Sent — Peter Liu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:dark; --bg:#0b1020; --white:#f5f7ff; --muted:rgba(245,247,255,.72); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--white); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; text-align:center; -webkit-font-smoothing:antialiased; }
    h1 { margin:0; font:600 clamp(2rem,5vw,3rem)/1.1 Montserrat,"Helvetica Neue",sans-serif; }
    p { margin:18px 0 30px; color:var(--muted); font-size:14px; }
    a { color:var(--white); font-size:12px; letter-spacing:.13em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid rgba(245,247,255,.5); padding-bottom:6px; }
  </style>
</head>
<body>
  <main>
    <h1>Thank you.</h1>
    <p>Your message has been sent. I'll be in touch.</p>
    <a href="index.html">Back to home</a>
  </main>
</body>
</html>
