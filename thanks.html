<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Thank you — Peter Liu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --white:#f5f7ff; --muted:rgba(245,247,255,.72); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--bg); color:var(--white); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;  isolation:isolate; }
    /* Shared antique navy texture */
    body::before {
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background-image: linear-gradient(rgba(11,16,32,.30),rgba(11,16,32,.50)), url("/assets/background.png");
      background-position: center center, center center;
      background-size: 100% 100%, cover;
      background-repeat: no-repeat, no-repeat;
    }

    .brand { position:fixed; top:30px; left:34px; z-index:2; color:var(--white); text-decoration:none; font:600 30px Montserrat,"Helvetica Neue",sans-serif; letter-spacing:-.01em; }
    nav { position:fixed; top:30px; right:34px; display:flex; gap:clamp(16px,2.5vw,32px); }
    nav a { color:var(--muted); text-decoration:none; font-size:12px; letter-spacing:.13em; text-transform:uppercase; transition:color 180ms ease; }
    nav a:hover { color:var(--white); }
    main { min-height:100svh; width:min(100% - 48px,760px); margin:0 auto; padding:clamp(145px,20vh,205px) 0 80px; }
    h1 { margin:0; font:600 clamp(2.2rem,5vw,3.4rem)/1.05 Montserrat,"Helvetica Neue",sans-serif; letter-spacing:-.025em; }
    .intro { margin:18px 0 48px; color:var(--muted); font-size:12px; letter-spacing:.13em; text-transform:uppercase; }
    .back { display:inline-block; padding:13px 22px; border:1px solid rgba(245,247,255,.55); color:var(--white); text-decoration:none; font-size:12px; letter-spacing:.13em; text-transform:uppercase; transition:background 180ms ease,color 180ms ease; }
    .back:hover { background:var(--white); color:var(--bg); }
    @media(max-width:640px) {
      .brand { top:18px; left:20px; font-size:26px; }
      nav { top:58px; left:18px; right:18px; justify-content:flex-end; gap:14px; }
      nav a { font-size:12px; letter-spacing:.06em; }
      main { width:calc(100% - 40px); padding-top:160px; }
      .intro { margin-bottom:38px; }
    }
  </style>
</head>
<body>
  <a class="brand" href="index.html">Peter Liu</a>
  <nav aria-label="Main navigation">
    <a href="about.html">About</a>
    <a href="works.html">Selected Works</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <h1>Thank you</h1>
    <p class="intro">Your message was sent. I'll get back to you soon.</p>
    <a class="back" href="index.html">Back to home</a>
  </main>
</body>
</html>
